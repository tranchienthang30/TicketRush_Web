name: Deploy Google VM

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: luuLoad

concurrency:
  group: deploy-google-vm-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Compute Engine
    runs-on: ubuntu-latest
    env:
      VM_USER: ${{ secrets.GCP_VM_USER }}
      VM_HOST: ${{ secrets.GCP_VM_HOST }}
      DEPLOY_PATH: ${{ secrets.GCP_VM_DEPLOY_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.GCP_VM_SSH_PRIVATE_KEY }}
      DEPLOY_BRANCH: ${{ inputs.branch }}

    steps:
      - name: Prepare SSH
        run: |
          test -n "$VM_USER" || { echo "Missing secret GCP_VM_USER"; exit 1; }
          test -n "$VM_HOST" || { echo "Missing secret GCP_VM_HOST"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "Missing secret GCP_VM_DEPLOY_PATH"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing secret GCP_VM_SSH_PRIVATE_KEY"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ticketrush_deploy_key
          chmod 600 ~/.ssh/ticketrush_deploy_key
          ssh-keyscan -T 20 -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/ticketrush_deploy_key "$VM_USER@$VM_HOST" "
            set -e
            cd '$DEPLOY_PATH'
            git fetch origin '$DEPLOY_BRANCH'
            if git show-ref --verify --quiet 'refs/heads/$DEPLOY_BRANCH'; then
              git checkout '$DEPLOY_BRANCH'
              git pull --ff-only origin '$DEPLOY_BRANCH'
            else
              git checkout -b '$DEPLOY_BRANCH' 'origin/$DEPLOY_BRANCH'
            fi
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
            docker image prune -f
          "

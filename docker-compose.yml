services:
  postgres:
    image: postgres:16
    container_name: ticketrush-postgres
    environment:
      POSTGRES_DB: ticketrush
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: ticketrush
    ports:
      - "5432:5432"
    volumes:
      - ticketrush_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ticketrush-redis
    ports:
      - "6379:6379"

volumes:
  ticketrush_postgres_data:
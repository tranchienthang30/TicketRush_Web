server:
  port: 8080

spring:
  application:
    name: ticketrush
  jackson:
    time-zone: Asia/Ho_Chi_Minh

  datasource:
    url: jdbc:postgresql://localhost:5432/ticketrush
    username: ticketrush
    password: ticketrush
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  sql:
    init:
      mode: never

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your secret}
            scope:
              - openid
              - email
              - profile

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-demo-secret-key-at-least-32-characters-long}
    expiration-ms: 86400000

  booking:
    lock-minutes: 10

frontend:
  url: http://localhost:5173
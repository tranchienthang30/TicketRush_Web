server:
  port: 8080

spring:
  application:
    name: ticketrush
  jackson:
    time-zone: Asia/Ho_Chi_Minh

  datasource:
    url: jdbc:postgresql://localhost:5432/ticketrush
    username: ticketrush
    password: ticketrush
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true

  sql:
    init:
      mode: never

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your id}
            scope:
              - openid
              - email
              - profile

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-demo-secret-key-at-least-32-characters-long}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  mail:
    from: ${MAIL_FROM:no-reply@ticketrush.local}

  session:
    customer-duration-ms: 1800000

  recaptcha:
    enabled: ${RECAPTCHA_ENABLED:false}
    secret: ${RECAPTCHA_SECRET:}
    min-score: ${RECAPTCHA_MIN_SCORE:0.5}

  booking:
    lock-minutes: 10

  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    return-url: ${PAYOS_RETURN_URL:http://localhost:5173/checkout/success}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/checkout/cancel}

frontend:
  url: http://localhost:5173

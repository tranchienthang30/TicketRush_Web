server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: ticketrush
  jackson:
    time-zone: Asia/Ho_Chi_Minh

  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticketrush}"
    username: "${SPRING_DATASOURCE_USERNAME:ticketrush}"
    password: "${SPRING_DATASOURCE_PASSWORD:ticketrush}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: "${JPA_SHOW_SQL:true}"
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true

  sql:
    init:
      mode: never

  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"

  cache:
    type: redis

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID}"
            client-secret: "${GOOGLE_CLIENT_SECRET}"
            scope:
              - openid
              - email
              - profile

  mail:
    host: "${MAIL_HOST:localhost}"
    port: "${MAIL_PORT:1025}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: "${MAIL_SMTP_AUTH:false}"
          starttls:
            enable: "${MAIL_SMTP_STARTTLS:false}"

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}"

  cookie:
    secure: "${COOKIE_SECURE:false}"
    same-site: "${COOKIE_SAME_SITE:Lax}"

  jwt:
    secret: "${JWT_SECRET:this-is-a-demo-secret-key-at-least-32-characters-long}"
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  mail:
    from: "${MAIL_FROM:no-reply@ticketrush.local}"

  admin:
    email: "${ADMIN_EMAIL:}"

  session:
    customer-duration-ms: 1800000

  recaptcha:
    enabled: "${RECAPTCHA_ENABLED:false}"
    secret: "${RECAPTCHA_SECRET:}"
    min-score: "${RECAPTCHA_MIN_SCORE:0.5}"

  booking:
    lock-minutes: 1
    expire-interval-ms: 15000
    expire-initial-delay-ms: 15000

  virtual-queue:
    enabled: "${VIRTUAL_QUEUE_ENABLED:true}"
    max-active-users: "${VIRTUAL_QUEUE_MAX_ACTIVE_USERS:50}"
    release-batch-size: "${VIRTUAL_QUEUE_RELEASE_BATCH_SIZE:50}"
    access-ttl-seconds: "${VIRTUAL_QUEUE_ACCESS_TTL_SECONDS:900}"

  upload:
    dir: "${UPLOAD_DIR:uploads}"

  payos:
    client-id: "${PAYOS_CLIENT_ID:}"
    api-key: "${PAYOS_API_KEY:}"
    checksum-key: "${PAYOS_CHECKSUM_KEY:}"
    return-url: "${PAYOS_RETURN_URL:http://localhost:5173/checkout/success}"
    cancel-url: "${PAYOS_CANCEL_URL:http://localhost:5173/checkout/cancel}"

  seatsio:
    region: "${SEATSIO_REGION:eu}"
    admin-key: "${SEATSIO_ADMIN_KEY:}"
    sandbox: "${SEATSIO_SANDBOX:false}"

frontend:
  url: "${FRONTEND_URL:http://localhost:5173}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
